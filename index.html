<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="טיימר">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>טיימר ריצה</title>
<style>
  :root{--bg:#f2f2f7;--card:#fff;--line:#e5e5ea;--tx:#1c1c1e;--sec:#8e8e93;--fill:#e9e9ee;--blue:#007aff;--green:#34c759;--red:#ff3b30;--warn:#b25000;--warnBg:#fff4e0}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--line:#38383a;--tx:#fff;--sec:#98989f;--fill:#2c2c2e;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--warn:#ffb340;--warnBg:#2e2412}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;font-size:17px;touch-action:manipulation}
  #app{max-width:560px;margin:0 auto;padding:10px 16px 40px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;gap:12px;margin:4px 4px 18px}
  .logo{width:52px;height:52px;flex:none}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:12px}
  .top h1{font-size:28px;font-weight:700;letter-spacing:-0.4px;margin:0;line-height:1.1}
  .top .sub{font-size:13px;color:var(--sec);margin-top:2px}
  .sh{font-size:13px;color:var(--sec);margin:0 16px 6px}
  .card{background:var(--card);border-radius:16px;margin-bottom:18px;overflow:hidden}
  .bat{display:flex;align-items:center;width:100%;border:0;background:none;font:inherit;color:var(--tx);text-align:start;padding:15px 16px;border-bottom:.5px solid var(--line)}
  .bat:last-child{border-bottom:0}
  .bat b{font-weight:600}
  .bat .chk{margin-inline-start:auto;color:var(--blue);font-weight:700;visibility:hidden}
  .bat.on .chk{visibility:visible}
  #login{padding:14px}
  #login p{margin:0 4px 10px;font-size:15px;color:var(--sec)}
  #login p.bad{color:var(--red)}
  #codeIn{font:inherit;color:var(--tx);border:0;outline:none;background:var(--fill);border-radius:12px;padding:12px 14px;width:100%;text-align:center;font-size:22px;letter-spacing:2px}
  button.wide{display:block;width:100%;border:0;border-radius:14px;font:inherit;font-size:17px;font-weight:600;padding:14px;color:#fff;background:var(--blue);margin-top:10px}
  button.wide:disabled{background:var(--fill);color:var(--sec)}
  .go{display:flex;gap:12px;margin-bottom:18px}
  .go a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:130px;border-radius:22px;text-decoration:none;color:#fff;font-weight:700;font-size:22px}
  .go a small{font-size:14px;font-weight:500;opacity:.9}
  #timerLink{background:var(--green)}
  #namesLink{background:var(--blue)}
  #logout{display:block;margin:0 auto 18px;border:0;background:none;color:var(--sec);font:inherit;font-size:14px}
  #install{background:var(--warnBg);color:var(--warn);padding:12px 14px;font-size:15px;line-height:1.4}
  #install button{border:0;border-radius:999px;background:var(--card);color:var(--warn);font:inherit;font-size:15px;font-weight:600;padding:6px 14px;margin-top:8px}
  .hidden{display:none !important}
</style>
<script src="app.js"></script>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="logo"><img data-logo alt=""></div>
    <div>
      <h1 id="title">טיימר ריצה</h1>
      <div class="sub" id="sub">כניסה בקוד גישה</div>
    </div>
  </div>

  <div class="card hidden" id="install"></div>

  <div class="card hidden" id="login">
    <p id="loginMsg">הקלד את קוד הגישה שקיבלת</p>
    <input id="codeIn" type="password" inputmode="text" autocomplete="off" autocapitalize="off" placeholder="קוד גישה" dir="ltr">
    <button class="wide" id="loginBtn" disabled>כניסה</button>
  </div>

  <div id="pickWrap" class="hidden">
    <div class="sh" id="pickTitle"></div>
    <div class="card" id="bats"></div>
  </div>

  <div id="goWrap" class="hidden">
    <div class="go">
      <a id="timerLink" href="timer.html">טיימר<small>זינוקים וסיומים</small></a>
      <a id="namesLink" href="names.html">רישום שמות<small>ותוצאות</small></a>
    </div>
    <button id="logout">יציאה (כניסה בקוד אחר)</button>
  </div>
</div>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var MSG = {
    bad_code: 'הקוד לא נכון, או שהוחלף. הקלד את הקוד העדכני.',
    no_code: 'הגישה סגורה כרגע.',
    bad_battalion: 'הבחירה כבר לא קיימת. היכנס מחדש.',
    locked: 'יותר מדי ניסיונות. נסה שוב בעוד 10 דקות.'
  };

  // אחרי כניסה: רשימת הקבוצות מהשרת, ואחרי בחירה כפתורי טיימר / רישום
  function showPick() {
    var s = APP.session, cur = null;
    $('title').textContent = s.title || 'טיימר ריצה';
    $('sub').textContent = 'בוחרים, ואז טיימר או רישום שמות';
    if (s.logo) document.querySelector('img[data-logo]').src = s.logo;
    var html = '';
    (s.battalions || []).forEach(function (x) {
      if (x.b === s.b) cur = x;
      html += '<button class="bat' + (x.b === s.b ? ' on' : '') + '" data-b="' + x.b + '"><b>' + esc(x.labels && x.labels.unit || x.name) + '</b><span class="chk">✓</span></button>';
    });
    $('bats').innerHTML = html;
    $('pickTitle').textContent = cur ? '' : 'בחר:';
    $('login').classList.add('hidden');
    $('pickWrap').classList.remove('hidden');
    $('goWrap').classList.toggle('hidden', !cur);
  }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function showLogin(reason) {
    $('title').textContent = 'טיימר ריצה'; $('sub').textContent = 'כניסה בקוד גישה';
    document.querySelector('img[data-logo]').src = 'icons/icon-192.png';
    $('goWrap').classList.add('hidden'); $('pickWrap').classList.add('hidden'); $('login').classList.remove('hidden');
    $('loginMsg').textContent = MSG[reason] || 'הקלד את קוד הגישה שקיבלת';
    $('loginMsg').className = MSG[reason] ? 'bad' : '';
    $('codeIn').value = ''; $('loginBtn').disabled = true;
  }

  function login() {
    var code = $('codeIn').value.trim(); if (!code) return;
    $('loginBtn').disabled = true; $('loginBtn').textContent = 'בודק...';
    APP.login(code).then(function () {
      $('loginBtn').textContent = 'כניסה';
      history.replaceState(null, '', './'); showPick();
    }, function (e) {
      $('loginBtn').textContent = 'כניסה'; $('loginBtn').disabled = false;
      if (e.denied) showLogin(e.message);
      else { $('loginMsg').textContent = 'אין חיבור לשרת. בכניסה הראשונה צריך קליטה.'; $('loginMsg').className = 'bad'; }
    });
  }

  $('codeIn').addEventListener('input', function () { $('loginBtn').disabled = !$('codeIn').value.trim(); });
  $('codeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('loginBtn').addEventListener('click', login);
  $('bats').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    APP.choose(b.getAttribute('data-b')); showPick();
  });
  $('logout').addEventListener('click', function () {
    if (!confirm('לצאת במכשיר הזה? בכניסה הבאה צריך קוד גישה.')) return;
    APP.logout(); showLogin('');
  });

  // הסבר התקנה: באייפון דרך "שיתוף", באנדרואיד כפתור התקנה
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) {
    $('install').innerHTML = 'להתקנה כאפליקציה: לוחצים על <b>שיתוף</b> (הריבוע עם החץ) ואז <b>הוספה למסך הבית</b>.';
    $('install').classList.remove('hidden');
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    $('install').innerHTML = 'אפשר להתקין כאפליקציה בטלפון.<br><button id="installBtn">התקנה</button>';
    $('install').classList.remove('hidden');
    $('installBtn').addEventListener('click', function () {
      e.prompt(); e.userChoice.then(function () { $('install').classList.add('hidden'); });
    });
  });

  // מי שכבר נכנס ממשיך ישר (גם בלי קליטה). ברקע מתעדכנת רשימת הקבוצות, ואם הקוד הוחלף חוזרים לכניסה.
  if (APP.session && !params.get('login')) {
    showPick();
    APP.login(APP.session.code).then(showPick, function (e) {
      if (e.denied && e.message !== 'locked') { APP.logout(); showLogin(e.message); }
    });
  }
  else { if (params.get('login')) APP.logout(); showLogin(params.get('login')); }
</script>
</body>
</html>
